<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hotel Makpetrol</title>

    <style>

        body {
            margin: 0;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            background: #f8fafc;
            color: #1f2937;
        }

        header {
            background: #0f172a;
            color: white;
            padding: 24px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hotel-name {
            font-size: 22px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav span {
            cursor: pointer;
        }

        .hero {
            min-height: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 18px;
            color: #64748b;
            max-width: 650px;
            line-height: 1.6;
        }

    </style>

</head>

<body>

    <header>

        <div class="hotel-name">
            Hotel Makpetrol
        </div>

        <nav>
            <span>Rooms</span>
            <span>Restaurant</span>
            <span>Pool</span>
            <span>Conference</span>
            <span>Contact</span>
        </nav>

    </header>

    <section class="hero">

        <h1>
            Welcome to Hotel Makpetrol
        </h1>

        <p>
            Enjoy a relaxing stay near Lake Ohrid in the Elen Kamen
            area of Struga, with comfortable accommodation,
            restaurant facilities, outdoor swimming pools,
            free parking and warm hospitality.
        </p>

    </section>

    <!-- HOTEL AI CONCIERGE -->
    <script src="widget/hotel-concierge-widget.js"></script>

</body>

</html>
