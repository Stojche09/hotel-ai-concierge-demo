<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Lake View Hotel</title>

    <style>

        body {
            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f8fafc;
            color: #1f2937;
        }

        header {
            background: #0f172a;
            color: white;

            padding: 24px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hotel-name {
            font-size: 22px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        .hero {
            min-height: 500px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 40px;
        }

        .hero h1 {
            font-size: 48px;

            margin-bottom: 10px;
        }

        .hero p {
            font-size: 18px;

            color: #64748b;

            max-width: 600px;
        }

    </style>

</head>

<body>


    <header>

        <div class="hotel-name">
            Lake View Hotel
        </div>

        <nav>
            <span>Rooms</span>
            <span>Restaurant</span>
            <span>Spa</span>
            <span>Contact</span>
        </nav>

    </header>


    <section class="hero">

        <h1>
            Welcome to Lake View Hotel
        </h1>

        <p>
            Relax beside Lake Ohrid and enjoy our rooms,
            restaurant, spa and hospitality.
        </p>

    </section>


    <!-- HOTEL AI CONCIERGE -->

    <script src="widget/hotel-concierge-widget.js"></script>


</body>

</html>
